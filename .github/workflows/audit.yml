name: Site Audit

on:
  push:
    branches:
      - main
    paths:
      - "**.html"
      - "**.js"
      - "sitemap.xml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run site audit
        run: python3 scripts/audit_site.py
