name: Generate Sitemap & Cache Bust

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate sitemap
        run: python scripts/generate_sitemap.py

      - name: Cache bust changed CSS/JS references
        run: python scripts/cache_bust.py

      - name: Commit sitemap and cache-bust updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update sitemap.xml and asset cache-bust versions"

      - name: Submit URLs to IndexNow
        run: python scripts/indexnow_submit.py
