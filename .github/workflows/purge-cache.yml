name: Purge Cache

on:
  push:
    branches:
      - main
    paths:
      - "**.html"
      - "**.css"
      - "**.js"
      - "**.json"
      - "**.xml"
      - "**.svg"
      - "**.png"
      - "**.jpg"
      - "**.jpeg"
      - "**.webp"
      - "**.ico"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to purge
        required: true
        default: production
        type: choice
        options:
          - production
          - staging

jobs:
  purge:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - name: Purge cache
        run: |
          response=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$response"
          success=$(echo "$response" | jq -r '.success')
          if [ "$success" != "true" ]; then
            echo "Purge failed"
            exit 1
          fi

      - name: Warm cache
        run: |
          curl -s https://scottlabz.com/sitemap.xml | grep -oP '(?<=<loc>)[^<]+' | while read -r url; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url")
            echo "$code $url"
          done
