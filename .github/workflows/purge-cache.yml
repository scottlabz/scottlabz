name: Purge Cloudflare Cache
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  purge-cache:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Purge Cloudflare cache
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "HTTP status: $http_code"
          echo "Response body: $body"

          if [ "$http_code" -ne 200 ]; then
            echo "::error::Cloudflare purge failed with HTTP $http_code"
            exit 1
          fi

          success=$(echo "$body" | grep -o '"success":[a-z]*' | cut -d: -f2)
          if [ "$success" != "true" ]; then
            echo "::error::Cloudflare purge reported failure: $body"
            exit 1
          fi

          echo "Cache purge successful."
