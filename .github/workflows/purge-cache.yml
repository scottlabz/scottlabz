name: Purge Cache

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to purge
        required: true
        default: production
        type: choice
        options:
          - production
          - staging

jobs:
  purge:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Purge cache
        run: echo "Purging cache for ${{ github.event.inputs.environment }}"
